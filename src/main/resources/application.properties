spring.application.name=report-service
spring.config.import=optional:file:.env[.properties]

server.port=${PORT:8084}
server.servlet.context-path=/api/reports

# Database connection to the new vistalhoteldbs_report DB
spring.datasource.url=${REPORT_DB_URL:}
spring.datasource.username=${REPORT_DB_USER:}
spring.datasource.password=${REPORT_DB_PASS:}
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MariaDBDialect

# Kafka Configuration
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.consumer.group-id=report-service-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=*

spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
# Jackson configuration
spring.jackson.mapper.accept-case-insensitive-enums=true
spring.jackson.serialization.write-dates-as-timestamps=false
